id: eoffice
label: eOffice / Document Management
keywords: [eoffice, văn bản, van ban, công văn, cong van, trình ký, trinh ky, phát hành văn bản, duyệt đa cấp, duyet da cap, dashboard SLA, báo cáo quá hạn, bao cao qua han, quá hạn, qua han]
modules: [văn bản đến, văn bản đi, hồ sơ công việc, trình ký, phát hành, báo cáo văn bản, lưu trữ, thông báo nhắc hạn]
roles:
  Clerk: Văn thư
  Officer: Chuyên viên
  DeptHead: Lãnh đạo phòng
  Director: Lãnh đạo cơ quan
quotation_defaults:
  risk_level: detailed
  manday_rate_vnd: 3900000

pack_version: 2
workflows:
  - incoming document intake, classification, assignment and tracking
  - outgoing document drafting, review, signing and release
  - work dossier creation, task assignment, comments and completion tracking
  - multi-level approval and internal signing/approval log workflow
  - release numbering, recipient distribution and immutable publication log
  - report filtering by department, status, overdue age and document type
  - archive search, permission-filtered retrieval and revision history
  - due-date reminder and escalation notification workflow
reports:
  - incoming document status and overdue list
  - outgoing document release dashboard
  - work dossier progress by assignee and department
  - approval queue by level and SLA
  - released document register
  - SLA by department and overdue age
  - archive lookup/export audit report
  - reminder/escalation effectiveness report
integrations:
  - LDAP/AD
  - Email notification
  - DMS API
  - Digital signature provider (Phase 2)
risk_factors:
  - legacy document migration
  - delegation/authorization matrix
  - external signing provider SLA
acceptance_presets:
  - Given Văn thư receives a valid incoming document, when it is registered and assigned, then the system creates a unique intake number, stores metadata/attachment, starts the routing workflow and writes an audit log.
  - Given Chuyên viên prepares an outgoing draft, when the draft is submitted for review/signing, then each approval step is recorded and the document cannot be released before required approvals are complete.
  - Given Lãnh đạo phòng assigns a work dossier, when assignee and due date are selected, then the task appears in the assignee workspace with SLA status and comment history.
  - Given a multi-level approval matrix, when a document is trình ký, then the system routes sequentially by configured level and blocks skipped/unauthorized approval.
  - Given a document is fully approved/signed, when Văn thư phát hành, then the system assigns release number, records recipients and makes the released version immutable except authorized revision flow.
  - Given overdue or near-due tasks exist, when user opens dashboard/report, then records can be filtered by department, status, age, document type and exported according to permission.
  - Given user searches the archive, when filters are applied, then only authorized records are returned and every export/download is audited.
  - Given a due date threshold is reached, when notification job runs, then assignee/manager receive reminder or escalation and notification status is logged.

capabilities_v2:
  - name: Quản lý văn bản
    description: Quản lý văn bản đến/đi, metadata, file đính kèm và phân loại hồ sơ.
    features:
      - name: Tiếp nhận văn bản đến
        description: Ghi nhận văn bản đến, số ký hiệu, đơn vị gửi, độ mật/khẩn và file đính kèm.
        complexity: Medium
        manday: 5
        inputs: [số văn bản, đơn vị gửi, ngày nhận, độ mật/khẩn, file đính kèm]
        outputs: [hồ sơ văn bản đến, mã/số vào sổ]
        validations: [số vào sổ không trùng, file đính kèm đúng định dạng]
        permissions: [Văn thư tạo văn bản đến, Chuyên viên xem theo phân công]
        audit_events: [tiếp nhận văn bản, cập nhật metadata]
        business_rules: [văn bản mật chỉ hiển thị theo phân quyền]
      - name: Soạn thảo và phát hành văn bản đi
        description: Soạn thảo dự thảo, trình duyệt, ký và phát hành văn bản đi.
        complexity: Complex
        manday: 7
        inputs: [dự thảo, nơi nhận, luồng duyệt, file ký]
        outputs: [văn bản phát hành, lịch sử xử lý]
        validations: [văn bản chỉ phát hành sau khi được duyệt/ký]
        permissions: [Chuyên viên soạn thảo, Lãnh đạo duyệt/ký, Văn thư phát hành]
        audit_events: [trình duyệt, phê duyệt, ký, phát hành]
        business_rules: [văn bản đã phát hành là immutable trừ quy trình đính chính]
  - name: Luồng xử lý và lưu trữ
    description: Phân công, theo dõi xử lý, SLA và lưu trữ tra cứu văn bản.
    features:
      - name: Phân công và xử lý công việc
        description: Phân công xử lý văn bản, theo dõi hạn xử lý, ý kiến và kết quả.
        complexity: Complex
        manday: 7
        inputs: [văn bản, người xử lý, hạn xử lý, ý kiến chỉ đạo]
        outputs: [task xử lý, trạng thái, nhắc hạn]
        validations: [người xử lý phải thuộc phạm vi phân quyền]
        permissions: [Lãnh đạo phân công, Chuyên viên xử lý]
        audit_events: [phân công, cập nhật kết quả xử lý]
        business_rules: [task quá hạn phải hiển thị trên dashboard]
      - name: Tra cứu và lưu trữ văn bản
        description: Tìm kiếm văn bản theo metadata, nội dung và trạng thái lưu trữ.
        complexity: Medium
        manday: 5
        inputs: [từ khóa, loại văn bản, ngày, trạng thái, đơn vị]
        outputs: [kết quả tra cứu, hồ sơ lưu trữ]
        validations: [không trả về văn bản vượt quyền xem]
        permissions: [người dùng xem theo phân quyền, Văn thư quản lý lưu trữ]
        audit_events: [export danh sách văn bản]
        business_rules: [văn bản mật/khẩn tuân thủ ma trận phân quyền]
data_entities: [IncomingDocument, OutgoingDocument, Attachment, WorkflowTask, ApprovalStep, ArchiveRecord, AuditLog]
assumptions: [Ma trận phân quyền và luồng ký được xác nhận trong workshop, Nhà cung cấp chữ ký số cung cấp API/SDK hợp lệ]
out_of_scope: [OCR/AI extraction nâng cao nếu chưa xác nhận, Migration toàn bộ kho văn bản lịch sử nếu chưa estimate riêng]
allowed_terms: [workflow, digital signature, API, SLA, dashboard, audit log, UAT]
blocked_terms: [RFID, asset allocation, opportunity forecast]
