id: asset_management
label: Asset Management / Quản lý TTB Tài sản
keywords: [tài sản, tai san, ttb, trang thiết bị, cấp phát, kiểm kê, bảo trì, thanh lý]
modules: [danh mục tài sản, hồ sơ tài sản, cấp phát, thu hồi, điều chuyển, kiểm kê, bảo trì, thanh lý, báo cáo tài sản]
roles:
  AssetManager: Quản lý tài sản
  DepartmentManager: Quản lý phòng ban
  Employee: Nhân viên sử dụng tài sản
  Accounting: Kế toán tài sản
quotation_defaults:
  risk_level: detailed
  manday_rate_vnd: 3900000

pack_version: 2
workflows:
  - asset allocation handover return transfer
  - inventory campaign reconciliation
  - maintenance ticket lifecycle
  - liquidation approval
reports:
  - asset by department
  - asset status aging
  - inventory discrepancy
  - maintenance cost
integrations:
  - HRM employee data
  - ERP/accounting
  - Barcode/RFID optional
risk_factors:
  - initial asset data migration
  - serial/asset code uniqueness
  - inventory evidence quality
acceptance_presets:
  - asset_code is system generated
  - Unauthorized transfer is blocked and audited
  - Inventory discrepancy requires reconciliation note
