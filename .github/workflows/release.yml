name: PMO Studio Release Check

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install package
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .

      - name: Verify all
        run: scripts/verify_all.sh /tmp/pmo-release-ci

      - name: Build package
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmo-studio-dist
          path: dist/*
